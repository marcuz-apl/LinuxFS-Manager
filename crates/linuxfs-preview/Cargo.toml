[package]
name = "linuxfs-preview"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "LinuxFSManager"
path = "src/main.rs"

[dependencies]
linuxfs-app = { path = "../linuxfs-app" }
linuxfs-core = { path = "../linuxfs-core" }
linuxfs-winfsp = { path = "../linuxfs-winfsp" }
raw-window-handle = "0.6"
slint = { version = "1.13", features = ["raw-window-handle-06"] }

[target.'cfg(windows)'.dependencies]
rfd = "0.15"
winfsp = "0.13"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[lints]
workspace = true
