[package]
name = "linuxfs-winfsp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
linuxfs-core = { path = "../linuxfs-core" }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
winfsp = { version = "0.13", default-features = false, features = ["delayload"] }
winfsp-sys = { version = "0.12", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winfsp = { version = "0.13", default-features = false, features = ["delayload"] }
[dev-dependencies]
linuxfs-ext = { path = "../linuxfs-ext" }
linuxfs-storage = { path = "../linuxfs-storage" }